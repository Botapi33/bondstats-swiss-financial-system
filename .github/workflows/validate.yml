name: Validate Swiss Financial System

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Swiss dataset
        run: npm run validate

      - name: Build Astro site
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          COUNT=$(find dist -name "index.html" | wc -l)
          echo "Generated HTML pages: $COUNT"

          if [ "$COUNT" -ne 101 ]; then
            echo "ERROR: Expected exactly 101 HTML pages, but found $COUNT."
            exit 1
          fi

          echo "Swiss Financial System build verified successfully."
          echo "100 detail pages + 1 hub = 101 HTML pages."
