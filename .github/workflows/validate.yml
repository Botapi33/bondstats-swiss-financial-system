name: Build and Deploy Swiss Financial System

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Validate Swiss dataset
        run: npm run validate

      - name: Build Astro site
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist

          COUNT=$(find dist -name "index.html" | wc -l | tr -d ' ')
          echo "Generated HTML pages: $COUNT"

          if [ "$COUNT" -ne 101 ]; then
            echo "ERROR: Expected exactly 101 HTML pages, but found $COUNT."
            exit 1
          fi

          echo "Swiss Financial System verified successfully."
          echo "100 detail pages + 1 hub = 101 HTML pages."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
