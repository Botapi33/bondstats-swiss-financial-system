<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swiss Financial System | BondStats</title><meta name="description" content="Explore 100 specialist concepts behind the Swiss financial system."><meta name="robots" content="index,follow"><link rel="stylesheet" href="./style.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="https://www.bondstats.org/">BOND<span>STATS</span></a></div></header><main id="app"></main><footer class="foot"><div class="wrap">BondStats · Swiss Financial System Research Database</div></footer><script src="./data.js"></script><script>
const A=document.getElementById('app'),D=window.SWISS_DATA;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){document.title='Swiss Financial System: 100 Market Mechanisms | BondStats';history.replaceState(null,'',location.pathname);A.innerHTML=`<section class="hero"><div class="wrap"><div class="k">RESEARCH DATABASE · SWITZERLAND</div><h1>Swiss Financial System</h1><p class="lead">Explore 100 specialist concepts behind Swiss finance: monetary plumbing, CHF funding, sovereign debt, settlement, bank resolution, mortgages and institutional capital.</p><input id="q" class="search" placeholder="Search 100 mechanisms…"><div id="grid" class="grid"></div></div></section>`;render(D);document.getElementById('q').oninput=e=>render(D.filter(x=>(x.title+' '+x.description).toLowerCase().includes(e.target.value.toLowerCase())))}
function render(xs){document.getElementById('grid').innerHTML=xs.map((x,i)=>`<a class="item" href="?concept=${encodeURIComponent(x.slug)}" data-slug="${esc(x.slug)}"><small>${String(i+1).padStart(3,'0')}</small><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></a>`).join('');document.querySelectorAll('[data-slug]').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.slug);history.pushState(null,'','?concept='+encodeURIComponent(a.dataset.slug))})}
function show(slug){const x=D.find(v=>v.slug===slug);if(!x)return home();document.title=x.title+' | Swiss Financial System | BondStats';A.innerHTML=`<div class="wrap article"><a class="back" href="./">← All 100 mechanisms</a><div class="k">SWISS FINANCIAL SYSTEM</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.description)}</p>${x.content.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;document.querySelector('.back').onclick=e=>{e.preventDefault();history.pushState(null,'',location.pathname);home()};scrollTo(0,0)}
addEventListener('popstate',()=>{const s=new URLSearchParams(location.search).get('concept');s?show(s):home()});const s=new URLSearchParams(location.search).get('concept');s?show(s):home();
</script></body></html>
